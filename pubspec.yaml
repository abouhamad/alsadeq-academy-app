name: alsadeq_academy_app
description: Mobile app for Al Sadeq Academy (eSkooly Pro backend) - parent, student and teacher portal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Local/secure storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Push notifications (server already sends FCM with click_action: FLUTTER_NOTIFICATION_CLICK)
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.2
  flutter_local_notifications: ^17.2.3

  # UI helpers
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  url_launcher: ^6.3.0

  # QR pickup / dismissal
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
